{% extends "base.html" %}
{% import "_macros.html" as m %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="card">
    <h1>Forgot password</h1>
    <p class="muted mb">Enter the email address linked to your account and we will send you a reset link.</p>

    <form method="post" action="{{ url_for('auth.forgot_password') }}">
      {{ m.csrf() }}
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
    </form>

    <p class="mt text-center muted small">
      Remembered your password? <a href="{{ url_for('auth.login') }}">Back to login</a>
    </p>
  </div>
</div>
{% endblock %}
